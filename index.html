<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9f4" />
  <title>SushiPass — Choose your device</title>
  <style>
    :root{
      --ink:#262124;
      --ink-soft:#6e5d59;
      --cream:#fffaf5;
      --paper:#fff4ea;
      --white:#ffffff;
      --coral:#f8774e;
      --hot:#f15f43;
      --orange:#ff9b69;
      --line:#ecd9cd;
      --shadow:0 24px 70px rgba(80,38,20,.12);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      min-height:100vh;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #ffe8d8 0, transparent 30%),
        radial-gradient(circle at 85% 0%, #ffd9c1 0, transparent 26%),
        linear-gradient(180deg,#fffaf5 0%,#fff6ef 100%);
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      -webkit-font-smoothing:antialiased;
    }

    .card{
      width:100%;
      max-width:430px;
      background:rgba(255,255,255,.88);
      border:1px solid var(--line);
      border-radius:30px;
      padding:24px 18px 18px;
      box-shadow:var(--shadow);
      text-align:center;
      backdrop-filter:blur(10px);
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff3e8;
      border:1px solid #f3d7c7;
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:#8d5a46;
      margin-bottom:16px;
    }

    .logo{
      width:76px;
      height:76px;
      margin:0 auto 16px;
      border-radius:22px;
      background:linear-gradient(180deg,#fff1e5,#ffe0cc);
      border:1px solid #f1d6c6;
      display:grid;
      place-items:center;
      font-size:34px;
      box-shadow:0 10px 25px rgba(241,95,67,.15);
    }

    h1{
      font-size:34px;
      line-height:1.02;
      letter-spacing:-.05em;
      margin-bottom:12px;
    }

    h1 span{
      color:var(--hot);
    }

    p{
      font-size:15px;
      line-height:1.55;
      color:var(--ink-soft);
      max-width:320px;
      margin:0 auto 22px;
    }

    .device-grid{
      display:grid;
      gap:12px;
    }

    .device-btn{
      width:100%;
      min-height:68px;
      border:none;
      border-radius:20px;
      font-size:16px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .device-btn:hover{transform:translateY(-2px)}
    .device-btn:active{transform:translateY(1px)}

    .ios{
      background:linear-gradient(180deg,var(--coral),var(--hot));
      color:#fff;
      box-shadow:0 14px 26px rgba(241,95,67,.24);
    }

    .android{
      background:#fff8f2;
      color:var(--ink);
      border:1px solid #ecd9cd;
      box-shadow:0 10px 22px rgba(70,40,28,.06);
    }

    .icon{
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.18);
      font-size:18px;
      flex:0 0 auto;
    }

    .android .icon{
      background:#fff;
      border:1px solid #f0ded3;
    }

    .note{
      margin-top:16px;
      font-size:11px;
      line-height:1.5;
      color:#9b8a83;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">🍣 sushi pass access</div>

    <div class="logo">📱</div>

    <h1>choose your <span>device</span></h1>

    <p>
      select your phone to continue and explore
      sushi pass rewards.
    </p>

    <div class="device-grid">
      <button class="device-btn ios" type="button" data-device="ios">
        <span class="icon"></span>
        iPhone / iOS
      </button>

      <button class="device-btn android" type="button" data-device="android">
        <span class="icon">🤖</span>
        Android
      </button>
    </div>

    <div class="note">
      by continuing, you’ll be redirected to the next page.
    </div>
  </main>

  <script>
    function goNext(device) {
      const destination = new URL("/home/", window.location.origin);
      const params = new URLSearchParams(window.location.search);

      if (device) {
        params.set("device", device);
      }

      destination.search = params.toString();
      window.location.assign(destination.href);
    }

    document.querySelectorAll("[data-device]").forEach((btn) => {
      btn.addEventListener("click", function () {
        goNext(this.dataset.device);
      });
    });
  </script>
</body>
</html>
