
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f14">
  <title>SushiPass — Choose your device</title>

  <style>
    :root {
      --bg: #100f14;
      --panel: #211b22;
      --panel2: #2a2027;
      --text: #fff6f1;
      --muted: #bdaeb4;
      --line: #44323b;
      --coral: #e88770;
      --gold: #deb37b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 48% 0%,
          #44272e 0,
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #19141b,
          #100f14
        );
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 26px 19px 21px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(
        150deg,
        #292029,
        #1b181e
      );
      box-shadow: 0 24px 70px #0007;
      text-align: center;
    }

    .brand {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 19px auto;
      border-radius: 22px;
      background: #3c292d;
      border: 1px solid #624149;
      font-size: 37px;
    }

    h1 {
      font-size: clamp(31px, 8vw, 41px);
      line-height: 1.02;
      letter-spacing: -.055em;
      margin: 0 0 12px;
    }

    h1 span {
      color: var(--coral);
    }

    .sub {
      max-width: 330px;
      margin: 0 auto 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 11px;
    }

    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 66px;
      padding: 13px;
      border-radius: 18px;
      border: 1px solid transparent;
      font-size: 17px;
      font-weight: 850;
      transition: transform .15s ease;
    }

    .choice:active {
      transform: scale(.985);
    }

    .ios {
      background: var(--coral);
      color: #211519;
      box-shadow: 0 12px 27px #e8877024;
    }

    .android {
      background: var(--panel2);
      border-color: #62464c;
      color: var(--text);
    }

    .emoji {
      font-size: 23px;
    }

    .fine {
      margin: 17px 0 0;
      color: #968992;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="panel">

    <div class="brand">🍣 SushiPass</div>

    <div class="icon" aria-hidden="true">
      📱
    </div>

    <h1>
      Choose your <span>device</span>
    </h1>

    <p class="sub">
      Win money by scrolling.
      Choose your phone to explore
      available tasks and cash rewards.
    </p>

    <div class="actions">

      <a
        class="choice ios"
        href="/home/"
        data-device="ios"
      >
        <span class="emoji" aria-hidden="true">📱</span>
        iPhone / iOS
      </a>

      <a
        class="choice android"
        href="/home/"
        data-device="android"
      >
        <span class="emoji" aria-hidden="true">🤖</span>
        Android
      </a>

    </div>

    <p class="fine">
      Both options continue to the same page.
      Rewards depend on offer requirements.
    </p>

  </main>

  <script>
    // Preserve incoming tracking parameters.
    // Normal HTML links still work without JS.

    document.querySelectorAll(
      '[data-device]'
    ).forEach(function(link) {

      const url = new URL(
        '/home/',
        window.location.origin
      );

      const params = new URLSearchParams(
        window.location.search
      );

      params.set(
        'device',
        link.dataset.device
      );

      url.search = params.toString();
      link.href = url.href;

    });
  </script>
</body>
</html>
